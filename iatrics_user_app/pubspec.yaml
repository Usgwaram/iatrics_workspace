version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.4.0
  flutter_secure_storage: ^10.0.0
  provider: ^6.0.3
  image_picker: ^1.0.0
  camera: ^0.12.0
